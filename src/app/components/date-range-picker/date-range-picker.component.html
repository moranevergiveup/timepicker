<mat-form-field
  appearance="outline"
  color="primary"
  class="custom-range-field full-width">

  <mat-label>Enter a date range</mat-label>

  <mat-date-range-input
    [formGroup]="range"
    [rangePicker]="picker">

    <!-- START DATE -->
    <input
      matStartDate
      formControlName="start"
      placeholder="DD/MM/YYYY"
      maxlength="10"
      (input)="formatDateInput($event)"
      (keydown)="handleBackspace($event)"
      >

    <!-- END DATE -->
    <input
      matEndDate
      formControlName="end"
      placeholder="DD/MM/YYYY"
      maxlength="10"
      
      (input)="formatDateInput($event)"
      (keydown)="handleBackspace($event)"
      >

  </mat-date-range-input>

  <mat-hint>DD/MM/YYYY – DD/MM/YYYY</mat-hint>

  <!-- ACTION BUTTONS -->
  <div matSuffix class="suffix-actions">

    <!-- CLEAR -->
    <button
      mat-icon-button
      type="button"
      class="icon-btn-close"
      *ngIf="range.value.start || range.value.end"
      (click)="clearRange()">

      <mat-icon>close</mat-icon>

    </button>

    <!-- OPEN CALENDAR -->
    <button
      mat-icon-button
      type="button"
      class="icon-btn"
      (click)="picker.open()">

      <mat-icon>calendar_month</mat-icon>

    </button>

  </div>

 <mat-date-range-picker #picker [calendarHeaderComponent]="customHeader">
  
</mat-date-range-picker>

  <!-- ERRORS -->
  @if (range.controls.start.hasError('matStartDateInvalid')) {
    <mat-error>Invalid start date</mat-error>
  }

  @if (range.controls.end.hasError('matEndDateInvalid')) {
    <mat-error>Invalid end date</mat-error>
  }

</mat-form-field>
