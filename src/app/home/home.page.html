<ion-content class="ion-padding">

  <app-date-range-picker
    (rangeChange)="onRangeChange($event)"
  ></app-date-range-picker>

  <ion-card *ngIf="selectedRange">
    <ion-card-content>
      <p>
        Start:
        {{ selectedRange.start | date:'mediumDate' }}
      </p>

      <p>
        End:
        {{ selectedRange.end | date:'mediumDate' }}
      </p>
    </ion-card-content>
  </ion-card>

</ion-content>
